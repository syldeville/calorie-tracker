<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Calories">
<meta name="theme-color" content="#111">
<link rel="manifest" href="manifest.json">
<!-- Icon art: Noto Emoji avocado (github.com/googlefonts/noto-emoji), Apache License 2.0 -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Calories</title>
<style>
  /* Warm neutral base, white cards, green accent. Sizes: 13 / 15 / 17 / 44. */
  :root { --bg:#f4f4f1; --fg:#161816; --muted:#7c807b; --line:#e4e5e0; --card:#fff; --sunk:#ecede9;
          --accent:#2f7d4f; --err:#c0392b; --shadow:0 1px 2px rgba(40,50,40,.04), 0 6px 20px rgba(40,50,40,.06);
          --protein:#8e44ad; --carbs:#d9711b; --fat:#27ae60; --fiber:#2e86de; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0e0f0e; --fg:#eef0ed; --muted:#8d918c; --line:#262826; --card:#1a1b1a; --sunk:#141514;
          --accent:#4cae74; --err:#e5675a; --shadow:none;
          --protein:#c39bd3; --carbs:#f0a04b; --fat:#52c77f; --fiber:#6aa9ec; } }
  * { box-sizing:border-box; }
  html { background:var(--bg); }
  /* iOS 26 home-screen apps: viewport heights come up short by the top safe area, leaving a gap at the bottom;
     only lvh reports the full screen. */
  @media (display-mode: standalone) { body { height:100lvh !important; } }
  /* iOS 26 lays a Liquid Glass blur over the status bar that bleeds into the header, unless an opaque fixed box
     covers the top edge; WebKit then uses that box's colour instead. */
  body::before { content:''; position:fixed; top:0; left:0; right:0; height:env(safe-area-inset-top); background:var(--bg); z-index:2; }
  /* Fixed-height column: top bar and composer stay put, only #scroll scrolls. */
  body { margin:0 auto; max-width:520px; height:100dvh; display:flex; flex-direction:column; overflow:hidden;
         background:var(--bg); color:var(--fg); font:17px -apple-system, system-ui, sans-serif; font-variant-numeric:tabular-nums;
         -webkit-tap-highlight-color:transparent; }
  #home { flex:1; min-height:0; display:flex; flex-direction:column; position:relative; padding-top:max(8px, env(safe-area-inset-top)); }
  /* Chat overlay: blurs and dims the home view; the composer sits outside #home so it stays sharp. */
  #thread { position:absolute; inset:0; z-index:1; display:flex; flex-direction:column; padding:max(8px, env(safe-area-inset-top)) 16px 0;
            background:rgba(0,0,0,.55); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); }
  #msgs { flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain; }
  header { padding:0 8px; flex-shrink:0; }
  #scroll { flex:1; min-height:0; overflow-y:auto; padding:0 16px 16px; overscroll-behavior:contain; }
  button { font:inherit; border:0; background:none; color:var(--fg); cursor:pointer; }
  button:active { opacity:.6; }
  header { display:flex; align-items:center; }
  header button { font-size:24px; width:44px; height:44px; display:grid; place-items:center; color:var(--fg); }
  header button:disabled { opacity:.25; }
  header h1 { font-size:17px; font-weight:600; margin:0; white-space:nowrap; min-width:0; overflow:hidden; text-overflow:ellipsis; }
  header #cal { margin-left:auto; } /* date navigation on the left, tools on the right */

  /* Today's summary */
  .totals { flex-shrink:0; margin:8px 16px 16px; padding:20px 24px; background:var(--card); border-radius:24px; box-shadow:var(--shadow); }
  .hero { display:flex; align-items:baseline; justify-content:center; gap:8px; }
  .hero b { font-size:44px; font-weight:700; letter-spacing:-.02em; line-height:1; }
  .hero span, #sub { color:var(--muted); font-size:15px; }
  .bar { height:8px; border-radius:4px; background:var(--sunk); margin:16px 0 8px; overflow:hidden; }
  .bar i { display:block; height:100%; width:0; border-radius:4px; background:var(--accent); transition:width .4s ease; }
  .bar i.over { background:var(--err); }
  #sub { margin:0; text-align:center; }
  /* Macros: value first. Inline on entries, four columns in the summary. */
  .m { font-size:13px; display:inline-block; margin:4px 12px 0 0; }
  .m b { font-weight:600; }
  .m.p { color:var(--protein); } .m.c { color:var(--carbs); } .m.f { color:var(--fat); } .m.fb { color:var(--fiber); }
  #macros { display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; margin-top:16px; }
  #macros .m { margin:0; padding:8px 0; text-align:center; border-radius:12px; background:color-mix(in srgb, currentColor 10%, transparent); }
  #macros .m b { display:block; font-size:17px; }

  /* Entries */
  .card { display:flex; align-items:flex-start; gap:8px; background:var(--card); border-radius:20px; padding:16px 8px 16px 16px;
          margin-bottom:12px; box-shadow:var(--shadow); cursor:pointer; }
  .card .info { flex:1; min-width:0; }
  .card .top { display:flex; align-items:baseline; gap:12px; }
  .card .name { flex:1; min-width:0; }
  .card .kc { font-size:17px; font-weight:600; white-space:nowrap; }
  .card .kc small { font-size:13px; font-weight:400; color:var(--muted); margin-left:2px; }
  .card.ex .kc { color:var(--accent); }
  .card > .info > small { display:block; color:var(--muted); font-size:13px; margin-top:4px; }
  .card .x { color:var(--muted); font-size:20px; width:32px; height:32px; margin-top:-6px; flex-shrink:0; }
  .empty { color:var(--muted); text-align:center; margin-top:32px; }

  /* Chat */
  .msg { padding:12px 16px; border-radius:20px; margin:8px 0; max-width:85%; white-space:pre-wrap; }
  .msg.user { background:var(--accent); color:#fff; margin-left:auto; border-bottom-right-radius:8px; }
  .msg.assistant { background:var(--card); border-bottom-left-radius:8px; }
  #msgs .card { box-shadow:none; }
  #back { align-self:flex-start; font-size:24px; width:44px; height:44px; color:#fff; }
  #status { color:#ddd; text-align:center; min-height:1.4em; font-size:15px; }
  #status.err { color:#ff9b8f; }

  /* Composer */
  form#composer { flex-shrink:0; background:var(--bg); padding:8px 16px max(8px, env(safe-area-inset-bottom)); }
  .kb form#composer { padding-bottom:8px; } /* the keyboard covers the home indicator */
  .row { display:flex; gap:8px; align-items:flex-end; max-width:520px; margin:0 auto; padding:4px; background:var(--card);
         border-radius:26px; box-shadow:var(--shadow); }
  textarea { flex:1; font:inherit; resize:none; padding:10px 4px; border:0; outline:0; background:transparent; color:var(--fg); max-height:120px; }
  .cam { color:var(--muted); height:44px; width:44px; display:grid; place-items:center; cursor:pointer; flex-shrink:0; }
  #send { background:var(--accent); color:#fff; border-radius:50%; height:44px; width:44px; display:grid; place-items:center; flex-shrink:0;
          box-shadow:inset 0 1px 0 rgba(255,255,255,.2); }
  #send:disabled { opacity:.5; }
  .icon { width:22px; height:22px; display:block; }
  #preview { max-width:520px; margin:0 auto 8px; display:flex; align-items:center; gap:8px; }
  #preview img { height:56px; border-radius:12px; }

  /* Settings */
  dialog { border:0; border-radius:24px; background:var(--card); color:var(--fg); width:min(90vw, 400px); padding:24px; }
  dialog b { display:block; font-size:13px; font-weight:600; color:var(--muted); margin-top:16px; }
  dialog b:first-child { margin-top:0; }
  dialog input, dialog textarea { display:block; width:100%; font:inherit; padding:12px; margin:8px 0 0; border:1px solid var(--line);
                                  border-radius:12px; background:var(--bg); color:var(--fg); }
  dialog::backdrop { background:rgba(0,0,0,.55); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); }
  #settings .close { position:absolute; top:12px; right:12px; width:36px; height:36px; font-size:22px; color:var(--muted); }
  #save { display:block; margin:24px 0 0 auto; background:var(--accent); color:#fff; border-radius:12px; padding:12px 24px; font-weight:600;
          box-shadow:inset 0 1px 0 rgba(255,255,255,.2); }

  /* Calendar */
  /* The scroll handler keeps the view still when older months load above, so stop Chrome doing it too. */
  .cal #scroll { overflow-anchor:none; }
  #calendar { padding-bottom:8px; }
  #calendar .grid { display:grid; grid-template-columns:repeat(7, 1fr) 1.2fr; gap:4px; text-align:center; }
  #calendar .wkdays { position:sticky; top:0; z-index:1; background:var(--bg); padding:8px 0; }
  #calendar b { font-size:13px; font-weight:600; color:var(--muted); }
  #calendar .week { margin-bottom:4px; }
  #calendar .mo { display:block; font-size:10px; font-weight:700; text-transform:uppercase; color:var(--accent); }
  /* Days outside the month being viewed fade. */
  #calendar .week > * { transition:opacity .2s; }
  #calendar .out { opacity:.3; }
  #calendar button { background:var(--card); border-radius:12px; min-height:52px; font-size:15px; padding:4px 0; }
  #calendar button small { display:block; font-size:11px; color:var(--muted); }
  #calendar button.today { box-shadow:inset 0 0 0 2px var(--accent); }
  #calendar button:disabled { background:transparent; opacity:.4; }
  #calendar .wk { display:grid; place-content:center; font-size:13px; font-weight:600; color:var(--accent); }
  #calendar .wk.surplus { color:var(--err); }
  #calendar .wk small { font-size:11px; font-weight:400; color:var(--muted); }
  .cal .totals, .cal #meals, .cal #thread, .cal #composer, .cal #status { display:none !important; }
  body:not(.cal) #calendar { display:none; }
  [hidden] { display:none !important; }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>
</head>
<body>
<div id="home">
<header>
  <button id="prev" aria-label="Previous day">‹</button>
  <h1 id="day"></h1>
  <button id="next" aria-label="Next day">›</button>
  <!-- Icons: Lucide (lucide.dev), ISC license -->
  <button id="cal" aria-label="Calendar"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v3"/><path d="M16 2v3"/><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/></svg></button>
  <button id="health" aria-label="Sync to Apple Health"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5"/></svg></button>
  <button id="gear" aria-label="Settings">⚙︎</button>
</header>

<div class="totals">
  <div class="hero"><b id="kcal">0</b><span>kcal net</span></div>
  <div class="bar"><i id="bar"></i></div>
  <p id="sub"></p>
  <div id="macros"></div>
</div>

<div id="scroll">
  <main id="calendar"></main>
  <main id="meals"></main>
</div>
<section id="thread" hidden>
  <button id="back" type="button" aria-label="Back">‹</button>
  <div id="msgs"></div>
  <p id="status"></p>
</section>
</div>

<form id="composer">
  <div id="preview" hidden><img alt="Selected photo"><button type="button" id="unphoto" aria-label="Remove photo">×</button></div>
  <div class="row">
    <label class="cam" aria-label="Add photo"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.997 4a2 2 0 0 1 1.76 1.05l.486.9A2 2 0 0 0 18.003 7H20a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h1.997a2 2 0 0 0 1.759-1.048l.489-.904A2 2 0 0 1 10.004 4z"/><circle cx="12" cy="13" r="3"/></svg><input id="photo" type="file" accept="image/*" hidden></label>
    <textarea id="text" rows="1" placeholder="Add entry here"></textarea>
    <button id="send" aria-label="Send"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></svg></button>
  </div>
</form>

<dialog id="settings">
  <form method="dialog">
    <b>Anthropic API key</b>
    <input id="key" type="password" autocomplete="off" placeholder="sk-ant-…">
    <b>Profile (used to estimate exercise)</b>
    <textarea id="profile" rows="4"></textarea>
    <b>Daily TDEE before logged exercise (kcal)</b>
    <input id="tdee" type="number" inputmode="numeric" min="0">
    <button id="save" value="save">Save</button>
    <!-- after Save so Enter submits Save, not × -->
    <button class="close" value="cancel" aria-label="Close">×</button>
  </form>
</dialog>

<script type="module">
  import Anthropic from 'https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@0.127.0/+esm';

  const MODEL = 'claude-opus-5'; // swap to 'claude-sonnet-5' for cheaper estimates
  const DEFAULT_PROFILE = `5'4", 130 lb, 31 years old, 24% body fat, 21.8% subcutaneous fat, ` +
    'fat-free body weight 99.8 lb, muscle mass 93.8 lb, BMR 1351 kcal, sedentary lifestyle.';

  const system = () => 'You are a nutrition and exercise estimator for a personal log. The user either logs a meal (text and/or photo) ' +
    'or an exercise they did. Set `kind` accordingly.\n' +
    'Meal: list each food as an item with its estimated portion, calories and macros.\n' +
    '`fiber_g` is dietary fibre, which is part of `carbs_g` rather than additional to it.\n' +
    'Exercise: list each activity as an item; `calories` is active calories burned (above resting), macros are 0. ' +
    'Base the estimate on the user profile below.\n' +
    'An entry can span several messages. `items` must ALWAYS be the complete list for the whole entry so far: ' +
    'keep every item from earlier replies and add new ones (e.g. "also a coffee" adds a coffee item). ' +
    'Only change an existing item when the user corrects it (e.g. "it was 3 eggs" revises the eggs item). ' +
    'Never return just the new item. The app sums `items`, so do not include a total item.\n' +
    'In `reply`, briefly state what you assumed (portions, or intensity and duration). ' +
    '`name` is a short label for the whole entry, e.g. "Eggs, toast and coffee" or "Running, 30 min".\n\n' +
    'User profile: ' + load('profile', DEFAULT_PROFILE);
  const SCHEMA = {
    type: 'object',
    properties: {
      kind: { type: 'string', enum: ['meal', 'exercise'] },
      name: { type: 'string' },
      items: {
        type: 'array',
        items: {
          type: 'object',
          properties: {
            name: { type: 'string' },
            calories: { type: 'integer' },
            protein_g: { type: 'number' },
            carbs_g: { type: 'number' },
            fat_g: { type: 'number' },
            fiber_g: { type: 'number' },
          },
          required: ['name', 'calories', 'protein_g', 'carbs_g', 'fat_g', 'fiber_g'],
          additionalProperties: false,
        },
      },
      reply: { type: 'string' },
    },
    required: ['kind', 'name', 'items', 'reply'],
    additionalProperties: false,
  };

  const $ = id => document.getElementById(id);
  const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
  const save = (k, v) => localStorage.setItem(k, JSON.stringify(v));
  const dayKey = (d = day) => 'day:' + d.toLocaleDateString('en-CA'); // YYYY-MM-DD in local time
  const r = n => Math.round(n);
  const sumOf = (entries, f, kind = 'meal') => entries.filter(m => (m.kind ?? 'meal') === kind).reduce((s, m) => s + (m[f] ?? 0), 0);
  const netOf = entries => sumOf(entries, 'calories') - sumOf(entries, 'calories', 'exercise');

  const DEFAULT_TDEE = r(1351 * 1.2); // BMR × sedentary multiplier
  const wd = d => (d.getDay() + 6) % 7; // weekday with Monday = 0
  const midnight = () => new Date(new Date().setHours(0, 0, 0, 0)); // start of today
  // Calories burned minus eaten over finished logged days (before today) of the Mon–Sun week containing d. Unlogged days are skipped.
  function weekDeficit(d) {
    const tdee = load('tdee', DEFAULT_TDEE), today = midnight();
    let total = null; // null = nothing logged on a finished day, so there's no total to show
    for (let i = 0; i < 7; i++) {
      const w = new Date(d.getFullYear(), d.getMonth(), d.getDate() - wd(d) + i), entries = load(dayKey(w), []);
      if (w < today && entries.length) total += tdee - netOf(entries);
    }
    return total;
  }

  let day = new Date();
  let calMonth = null; // first of the month being viewed in the calendar; null = day view
  let calStart = null; // Monday of the oldest week loaded into the calendar; older ones load as you scroll up
  let openId = null; // meal whose thread is shown; null = new entry
  let chat = false;  // chat overlay open over the home view
  let photo = null;  // base64 JPEG of the pending photo, discarded after sending

  const thisMonth = () => new Date(new Date().getFullYear(), new Date().getMonth(), 1);
  const addMonths = (m, n) => new Date(m.getFullYear(), m.getMonth() + n, 1);

  const monday = d => new Date(d.getFullYear(), d.getMonth(), d.getDate() - wd(d));
  const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
  const monthOf = d => +new Date(d.getFullYear(), d.getMonth(), 1);

  function renderCalendar() {
    if (calMonth > thisMonth()) calMonth = thisMonth();
    calStart = new Date(Math.min(calStart ?? Infinity, monday(addMonths(calMonth, -6))));
    const weeks = [];
    for (let w = calStart; w < addMonths(thisMonth(), 1); w = addDays(w, 7)) weeks.push(weekEl(w));
    const head = el('div', '', { className: 'grid wkdays' });
    head.append(...['M', 'T', 'W', 'T', 'F', 'S', 'S', 'Deficit'].map(d => el('b', d)));
    $('calendar').replaceChildren(head, ...weeks);
    scrollToMonth(calMonth);
    showMonth(calMonth, true);
    highlightMonth();
  }

  // One Mon–Sun row, running straight across month ends; the 1st of each month is labelled with the month.
  function weekEl(mon) {
    const now = new Date(), row = el('div', '', { className: 'grid week' });
    for (let i = 0; i < 7; i++) {
      const d = addDays(mon, i), entries = load(dayKey(d), []);
      const btn = el('button', '', { type: 'button', disabled: d > now, onclick: () => { day = d; calMonth = null; openId = null; render(); } });
      if (d.getDate() === 1) btn.append(el('span', d.toLocaleDateString(undefined, { month: 'short' }), { className: 'mo' }));
      btn.append(d.getDate());
      btn.classList.toggle('today', d.toDateString() === now.toDateString());
      if (entries.length) btn.append(el('small', r(netOf(entries))));
      btn.month = monthOf(d);
      row.append(btn);
    }
    const def = weekDeficit(mon), wk = el('div', r(def).toLocaleString(), { className: 'wk' + (def < 0 ? ' surplus' : '') });
    wk.append(el('small', `${(Math.round(def / 350) / 10).toFixed(1)} lb`)); // ~3500 kcal per lb of fat; rounding first avoids "-0.0"
    row.append(def === null ? el('span', '') : wk); // blank until a logged day of the week has passed
    row.mon = mon;
    return row;
  }

  // Where the selection line sits in content coordinates at scroll position s: the centre of the view, except over
  // the last half screen of scrolling it slides down to the bottom, so the newest weeks get picked without
  // needing empty space below them.
  const lineAt = (s, h, max) => s + h / 2 + Math.max(0, s - (max - h / 2));

  // The month being viewed owns the week (by its Thursday) under the selection line.
  function highlightMonth() {
    const sc = $('scroll'), h = sc.clientHeight, max = sc.scrollHeight - h;
    const line = sc.getBoundingClientRect().top - sc.scrollTop + lineAt(sc.scrollTop, h, max) - 1;
    const weeks = [...document.querySelectorAll('.week')];
    const row = weeks.find(w => w.getBoundingClientRect().bottom > line) ?? weeks.at(-1);
    showMonth(new Date(monthOf(addDays(row.mon, 3))));
  }

  // Highlights month m: its days, and the deficits of weeks that touch it; everything else fades.
  let shownMonth = null;
  function showMonth(m, force) {
    calMonth = m;
    if (+m === shownMonth && !force) return; // restyling every row on each scroll event is wasted work
    shownMonth = +m;
    for (const w of document.querySelectorAll('.week')) {
      const days = [...w.querySelectorAll('button')];
      for (const b of days) b.classList.toggle('out', b.month !== shownMonth);
      w.lastChild.classList.toggle('out', !days.some(b => b.month === shownMonth));
    }
    $('day').textContent = m.toLocaleDateString(undefined, { month:'long', year:'numeric' });
    $('next').disabled = +m === +thisMonth();
  }

  $('scroll').addEventListener('scroll', () => {
    if (!calMonth) return;
    const sc = $('scroll');
    if (sc.scrollTop < 400) { // near the top: load ~6 older months of weeks above, keeping the view where it is
      const h = sc.scrollHeight, older = [];
      for (let i = -26; i < 0; i++) older.push(weekEl(addDays(calStart, i * 7)));
      calStart = older[0].mon;
      $('calendar').firstChild.after(...older);
      sc.scrollTop += sc.scrollHeight - h;
      showMonth(calMonth, true); // style the new rows
    }
    highlightMonth();
  }, { passive: true });
  // Scrolls so the selection line crosses the middle of month m (centred, except near the end). Scrolls #scroll
  // only (scrollIntoView would also nudge the fixed page).
  function scrollToMonth(m, behavior = 'instant') {
    const weeks = [...document.querySelectorAll('.week')], rowOf = d => weeks.find(w => w.mon <= d && d < addDays(w.mon, 7));
    const first = rowOf(m), last = rowOf(addDays(addMonths(m, 1), -1)), sc = $('scroll'), box = sc.getBoundingClientRect();
    if (!first || !last) return;
    const mid = sc.scrollTop - box.top + (first.getBoundingClientRect().top + last.getBoundingClientRect().bottom) / 2;
    const h = sc.clientHeight, max = sc.scrollHeight - h;
    sc.scrollTo({ top: mid <= max ? mid - h / 2 : (mid + max - h) / 2, behavior }); // lineAt solved for mid
  }
  const goMonth = n => scrollToMonth(addMonths(calMonth, n), 'smooth');

  function render() {
    if (!calMonth && document.body.classList.contains('cal')) { calStart = null; $('scroll').scrollTop = 0; } // leaving the calendar
    document.body.classList.toggle('cal', !!calMonth);
    if (calMonth) return renderCalendar();

    const meals = load(dayKey(), []);
    const isToday = day.toDateString() === new Date().toDateString();
    const sum = (f, kind) => sumOf(meals, f, kind);
    const eaten = sum('calories'), burned = sum('calories', 'exercise');

    $('day').textContent = isToday ? 'Today' : day.toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' });
    $('next').disabled = isToday;
    const net = eaten - burned, tdee = load('tdee', DEFAULT_TDEE), left = r(tdee - net), shown = r(net).toLocaleString();
    // A small pop when today's total changes, so a logged entry visibly lands.
    if ($('kcal').textContent !== shown && $('kcal').dataset.day === dayKey() && !matchMedia('(prefers-reduced-motion: reduce)').matches)
      $('kcal').animate([{ transform: 'scale(1.1)' }, { transform: 'none' }], { duration: 350, easing: 'cubic-bezier(.3,1.6,.6,1)' });
    $('kcal').textContent = shown;
    $('kcal').dataset.day = dayKey();
    $('bar').style.width = Math.min(100, Math.max(0, net / tdee * 100)) + '%';
    $('bar').classList.toggle('over', left < 0);
    $('sub').textContent = `Eaten ${r(eaten).toLocaleString()} · Exercise ${r(burned)} · ` +
      (left >= 0 ? `${left.toLocaleString()} under TDEE` : `${(-left).toLocaleString()} over TDEE`);
    $('macros').replaceChildren(...macroSpans(sum('protein'), sum('carbs'), sum('fat'), sum('fiber')));

    const meal = meals.find(m => m.id === openId);
    if (!meal) openId = null;
    $('thread').hidden = !chat;
    $('text').placeholder = meal ? 'Correct this entry…' : 'Add entry here';
    $('meals').replaceChildren(...(meals.length ? meals.map(card) : [el('p', 'Nothing logged yet.', { className: 'empty' })]));

    if (chat) {
      $('msgs').replaceChildren(...(meal ? [card(meal),
        ...meal.thread.map(t => el('div', t.role === 'user' ? (t.photo ? '📷 ' : '') + t.text : replyText(JSON.parse(t.text)), { className: 'msg ' + t.role }))]
        : [el('p', 'Describe a meal or workout, or add a photo.', { className: 'empty' })]));
      $('msgs').scrollTop = $('msgs').scrollHeight; // chat opens at the latest message
    }
  }

  // Claude's reply plus the item breakdown the entry's totals are summed from (older replies have no items).
  const replyText = out => [out.reply, ...(out.items ?? []).map(i => `• ${i.name}: ${i.calories} kcal`)].join('\n');

  // Protein purple, carbs orange, fat green, fibre blue. Entries logged before fibre existed have none.
  const macroSpans = (p, c, f, fb) => [['Protein', p, 'p'], ['Carbs', c, 'c'], ['Fat', f, 'f'], ['Fibre', fb ?? 0, 'fb']].map(([name, g, cls]) => {
    const s = el('span', ' ' + name, { className: 'm ' + cls });
    s.prepend(el('b', `${r(g)}g`));
    return s;
  });

  function card(m) {
    const isExercise = m.kind === 'exercise';
    const c = el('div', '', { className: 'card' + (isExercise ? ' ex' : ''), onclick: () => { openId = m.id; chat = true; render(); } });
    const info = el('div', '', { className: 'info' }), top = el('div', '', { className: 'top' });
    const kc = el('b', (isExercise ? '−' : '') + r(m.calories).toLocaleString(), { className: 'kc' });
    kc.append(el('small', 'kcal'));
    top.append(el('span', (isExercise ? '🏃 ' : '') + m.name, { className: 'name' }), kc);
    info.append(top);
    const extra = el(isExercise ? 'small' : 'div', isExercise ? 'Burned' : '');
    if (!isExercise) extra.append(...macroSpans(m.protein, m.carbs, m.fat, m.fiber));
    info.append(extra);
    const del = el('button', '×', { className: 'x', type: 'button', ariaLabel: 'Delete meal', onclick: e => {
      e.stopPropagation();
      save(dayKey(), load(dayKey(), []).filter(x => x.id !== m.id));
      render();
    } });
    c.append(info, del);
    return c;
  }

  function el(tag, text, props = {}) {
    const e = Object.assign(document.createElement(tag), props);
    e.textContent = text;
    return e;
  }

  function status(msg, isErr = false) {
    $('status').textContent = msg;
    $('status').className = isErr ? 'err' : '';
  }

  // Shrink to <=1568px on the long edge and re-encode as JPEG (keeps requests small and under the API image limit).
  async function toJpeg(file) {
    const url = URL.createObjectURL(file);
    try {
      const img = new Image();
      img.src = url;
      await img.decode();
      const scale = Math.min(1, 1568 / Math.max(img.naturalWidth, img.naturalHeight));
      const canvas = Object.assign(document.createElement('canvas'), { width: r(img.naturalWidth * scale), height: r(img.naturalHeight * scale) });
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      return canvas.toDataURL('image/jpeg', 0.85).split(',')[1];
    } finally {
      URL.revokeObjectURL(url);
    }
  }

  async function ask(thread, image) {
    const client = new Anthropic({ apiKey: load('apiKey', ''), dangerouslyAllowBrowser: true });
    // Past photos weren't kept; Claude's earlier reply already describes what it saw.
    const messages = thread.map(t => ({ role: t.role, content: t.photo ? '[photo analyzed earlier] ' + t.text : t.text }));
    if (image) {
      const last = messages.at(-1);
      last.content = [{ type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: image } },
                      { type: 'text', text: thread.at(-1).text || 'Estimate this meal.' }];
    }
    const res = await client.beta.messages.create({
      model: MODEL,
      max_tokens: 16000,
      thinking: { type: 'adaptive' },
      system: system(),
      messages,
      output_config: { format: { type: 'json_schema', schema: SCHEMA } },
      betas: ['server-side-fallback-2026-07-01'],
      fallbacks: 'default',
    });
    if (res.stop_reason === 'refusal') throw new Error('Claude declined to answer this one.');
    const text = res.content.findLast(b => b.type === 'text')?.text;
    if (res.stop_reason === 'max_tokens' || !text) throw new Error('Claude’s answer was cut off. Try again.');
    return text;
  }

  $('composer').onsubmit = async e => {
    e.preventDefault();
    const text = $('text').value.trim();
    if (!text && !photo) return;
    if (!load('apiKey', '')) return openSettings();

    const key = dayKey(); // capture now, in case the day changes while waiting
    const meals = load(key, []);
    const meal = meals.find(m => m.id === openId);
    const thread = [...(meal?.thread ?? []), { role: 'user', text, ...(photo && { photo: true }) }];

    $('send').disabled = true;
    status('Thinking…');
    if (!meal) $('msgs').replaceChildren(); // drop the empty-chat hint
    $('msgs').append(el('div', (photo ? '📷 ' : '') + text, { className: 'msg user' }));
    $('msgs').scrollTop = $('msgs').scrollHeight;
    const sent = photo; // the composer is cleared now, so hold the photo for the request
    $('text').value = '';
    $('text').style.height = 'auto';
    clearPhoto();
    try {
      const raw = await ask(thread, sent);
      const out = JSON.parse(raw);
      const total = f => out.items.reduce((s, i) => s + i[f], 0);
      const updated = { id: meal?.id ?? crypto.randomUUID(), kind: out.kind, name: out.name, calories: total('calories'),
        protein: total('protein_g'), carbs: total('carbs_g'), fat: total('fat_g'), fiber: total('fiber_g'), thread: [...thread, { role: 'assistant', text: raw }] };
      const fresh = load(key, []); // re-read so a delete made while waiting isn't undone
      save(key, meal ? fresh.map(m => m.id === meal.id ? updated : m) : [...fresh, updated]);
      openId = updated.id;
      status('');
    } catch (err) {
      // Put the text and photo back so nothing is lost.
      $('text').value = text;
      photo = sent;
      if (photo) {
        $('preview').querySelector('img').src = 'data:image/jpeg;base64,' + photo;
        $('preview').hidden = false;
      }
      status(err instanceof Anthropic.AuthenticationError ? 'Invalid API key — check settings (⚙︎).'
        : err instanceof Anthropic.RateLimitError ? 'Rate limited — wait a moment and retry.'
        : err instanceof Anthropic.APIConnectionError ? 'No connection — check your internet.'
        : err.message, true);
    } finally {
      $('send').disabled = false;
      render();
    }
  };

  $('photo').onchange = async e => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    chat = true;
    render();
    try {
      photo = await toJpeg(file);
      $('preview').querySelector('img').src = 'data:image/jpeg;base64,' + photo;
      $('preview').hidden = false;
    } catch {
      status('Couldn’t read that photo.', true);
    }
  };
  const clearPhoto = () => { photo = null; $('preview').hidden = true; };
  $('unphoto').onclick = clearPhoto;

  $('text').onfocus = () => { if (!chat) { chat = true; render(); } };
  $('back').onclick = () => { chat = false; openId = null; $('text').blur(); status(''); render(); };
  $('text').oninput = e => { e.target.style.height = 'auto'; e.target.style.height = e.target.scrollHeight + 'px'; };
  $('prev').onclick = () => { if (calMonth) return goMonth(-1); day.setDate(day.getDate() - 1); openId = null; render(); };
  $('next').onclick = () => { if (calMonth) return goMonth(1); day.setDate(day.getDate() + 1); openId = null; render(); };
  $('cal').onclick = () => { calMonth = calMonth ? null : new Date(day.getFullYear(), day.getMonth(), 1); render(); };
  // Sends every meal not sent before to the "Calorie Tracker to Health" shortcut, which logs it in Apple Health.
  // ponytail: marked as sent on tap since a home-screen app can't get a reliable callback; later corrections/deletes aren't resent.
  $('health').onclick = () => {
    const sent = new Set(load('healthSynced', []));
    const meals = Object.keys(localStorage).filter(k => k.startsWith('day:')).sort().flatMap(k =>
      load(k, []).filter(m => (m.kind ?? 'meal') === 'meal' && !sent.has(m.id)).map(m => ({ ...m, date: k.slice(4) + ' 12:00' })));
    if (!meals.length) return status('Nothing new to send to Health.');
    const payload = meals.map(m => ({ date: m.date, calories: r(m.calories), protein: r(m.protein), carbs: r(m.carbs), fat: r(m.fat), fiber: r(m.fiber ?? 0) }));
    save('healthSynced', [...sent, ...meals.map(m => m.id)]);
    location.href = 'shortcuts://run-shortcut?name=' + encodeURIComponent('Calorie Tracker to Health') +
      '&input=text&text=' + encodeURIComponent(JSON.stringify({ meals: payload }));
  };

  function openSettings() {
    $('key').value = load('apiKey', '');
    $('profile').value = load('profile', DEFAULT_PROFILE);
    $('tdee').value = load('tdee', DEFAULT_TDEE);
    $('settings').returnValue = ''; // Escape keeps the old returnValue, so reset it to avoid saving on cancel
    $('settings').showModal();
  }
  $('gear').onclick = openSettings;
  // Any delete wipes the whole key; beforeinput catches mobile keyboards where keydown is unreliable.
  $('key').addEventListener('beforeinput', e => { if (e.inputType.startsWith('delete')) { e.preventDefault(); $('key').value = ''; } });
  $('settings').onclose = () => {
    if ($('settings').returnValue !== 'save') return; // × or Escape discards edits
    if ($('key').value.trim()) save('apiKey', $('key').value.trim());
    if ($('profile').value.trim()) save('profile', $('profile').value.trim());
    if ($('tdee').value) save('tdee', +$('tdee').value);
    render();
  };

  // iOS doesn't shrink the page for the keyboard; size the body to the visible area so the composer sits above it.
  // Pin the layout to the visible area only while the keyboard is up; otherwise CSS sizes it (see the iOS 26 note).
  // innerHeight shrinks with the keyboard on iOS, so compare against the screen instead.
  const fit = () => {
    const keyboard = visualViewport.height < screen.height * .75;
    document.body.classList.toggle('kb', keyboard);
    document.body.style.setProperty('height', keyboard ? visualViewport.height + 'px' : '', keyboard ? 'important' : '');
    scrollTo(0, 0);
  };
  visualViewport.addEventListener('resize', fit);
  fit();

  render();
  if (!load('apiKey', '')) openSettings();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
